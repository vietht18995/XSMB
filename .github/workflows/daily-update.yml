name: Daily XSMB Auto Update

on:
  schedule:
    # 18:45 UTC+7 (11:45 UTC) — ngay sau giờ quay thưởng XSMB (18:30)
    - cron: '45 11 * * *'
    # 19:15 UTC+7 (12:15 UTC) — chạy dự phòng nếu xoso.com.vn cập nhật chậm
    - cron: '15 12 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: xsmb-daily-update
  cancel-in-progress: false

jobs:
  update-xsmb:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Sync XSMB data and rebuild index.html
        run: python3 scripts/auto_update_xsmb.py --no-excel

      - name: Commit and push if updated
        id: commit
        run: |
          # Khi chạy theo lịch (schedule), chỉ commit nếu có kỳ quay mới trong JSON cache
          # Khi chạy tay (workflow_dispatch), commit nếu JSON cache hoặc index.html thay đổi
          if [ "${{ github.event_name }}" = "schedule" ]; then
            if git diff --quiet data/xsmb_2014_2026_cache.json; then
              echo "Không có kỳ quay mới — bỏ qua commit."
              echo "pushed=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          else
            if git diff --quiet data/xsmb_2014_2026_cache.json index.html; then
              echo "Không có thay đổi — bỏ qua commit."
              echo "pushed=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          TODAY_VN=$(TZ="Asia/Ho_Chi_Minh" date +"%d/%m/%Y %H:%M")
          git add data/xsmb_2014_2026_cache.json index.html
          git commit -m "Auto update XSMB data & dashboard (${TODAY_VN} UTC+7)"
          git push origin main
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      - name: Trigger GitHub Pages rebuild
        if: steps.commit.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api -X POST "repos/${{ github.repository }}/pages/builds" || true
